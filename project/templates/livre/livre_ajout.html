<!-- templates/livre/livre_ajout.html -->

{% from "utils/navbar.html" import navbar %}

{% extends "base.html" %}

{% block navbar %}
    {{ navbar(current_user, "Ajouter un livre") }}
{% endblock %}

{% block content %}
    <h1 class="title is-1">
        Livre
    </h1>

    {% include 'utils/flash_message.html' %}

    <div class="content">
        <form action="/livre/ajout" method="post">
            <div class="field">
                <label class="label" for="title">Titre</label>
                <div class="control">
                    <input class="input" type="text" name="title" id="title" required {% if book.title %}value="{{ book.title }}"{% endif %}
                        hx-post="/livre/check-title"
                        hx-trigger="load, keyup changed delay:500ms"
                        hx-target="#title-error"
                        hx-swap="innerHTML">
                    <p id="title-error" class="help is-warning"></p>
                </div>
            </div>

            <div class="field">
                <label class="label" for="author">Auteur</label>
                <div class="control">
                    <input class="input" type="text" name="author" id="author" {% if book.authors %}value="{{ book.authors }}"{% endif %}>
                </div>
            </div>

            <div class="field">
                <label class="label" for="editor">Editeur</label>
                <div class="control">
                    <input class="input" type="text" name="editor" id="editor" {% if book.editor %}value="{{ book.editor }}"{% endif %}>
                </div>
            </div>

            <div class="field">
                <label class="label" for="year">Année</label>
                <div class="control">
                    <input class="input" type="number" name="year" id="year" {% if book.year %}value="{{ book.year }}"{% endif %}>
                </div>
            </div>

            <div class="field">
                <label class="label" for="type">Genre</label>
                <div class="control">
                    <input class="input" type="text" name="type" id="type" {% if book.type %}value="{{ book.type }}"{% endif %}>
                </div>
            </div>

            <div class="field">
                <label class="label" for="isbn">ISBN</label>
                <div class="control">
                    <input class="input" type="number" name="isbn" id="isbn" {% if book.isbn %}value="{{ book.isbn }}"{% endif %}>
                </div>
            </div>

            <div class="field">
                <label class="label" for="tags">Étiquettes</label>
                <div class="control">
                    <div class="tags-input-container">
                        <div id="tags-list" class="tags is-hidden"></div>
                        <input
                                id="tags-input"
                                class="input"
                                type="text"
                                placeholder="Ajouter une étiquette ou une catégorie"
                                autocomplete="off"
                        />
                    </div>
                </div>
                <input type="hidden" name="tags" id="tags-hidden-input" />
                <div class="dropdown" id="suggestions-dropdown">
                    <div class="dropdown-menu">
                        <div class="dropdown-content" id="suggestions-list"></div>
                    </div>
                </div>
            </div>

            <div class="field is-grouped">
                <div class="control">
                    <button class="button is-link" id="button-enregistrer">Enregistrer</button>
                </div>
                <div class="control">
                    <button class="button is-light">
                        <a href="/livre" class="has-text-black">Annuler</a>
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script>
        // Script pour la vérification du titre
        document.body.addEventListener('htmx:afterRequest', function (event) {
            if (event.detail.pathInfo.requestPath === "/livre/check-title") {
              const input = document.querySelector('#title');
              const errorMessage = event.detail.xhr.responseText;

              if (errorMessage) {
                input.classList.add('is-warning');
              } else {
                input.classList.remove('is-warning');
              }
            }
          });
    </script>

    <!-- Script pour la gestion des étiquettes -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {
      const existingTags = {{ tags|safe }}; // Liste des tags existants
      const selectedTags = new Set(); // Ensemble pour les tags sélectionnés
      const tagsInput = document.getElementById("tags-input");
      const tagsList = document.getElementById("tags-list");
      const tagsHiddenInput = document.getElementById("tags-hidden-input");
      const suggestionsDropdown = document.getElementById("suggestions-dropdown");
      const suggestionsList = document.getElementById("suggestions-list");

      // Mise à jour des suggestions
      function updateSuggestions() {
        const input = tagsInput.value.toLowerCase();
        const suggestions = existingTags.filter(tag =>
          tag.toLowerCase().includes(input) && !selectedTags.has(tag)
        );

        suggestionsList.innerHTML = suggestions
          .map(tag => `<a class="dropdown-item">${tag}</a>`)
          .join("");

        if (suggestions.length > 0) {
          suggestionsDropdown.classList.add("is-active");
        } else {
          suggestionsDropdown.classList.remove("is-active");
        }
      }

      // Ajouter un tag
      function addTag(tag) {
        if (tagsList.classList.contains("is-hidden")) {
          tagsList.classList.remove("is-hidden");
        }

        if (tag && !selectedTags.has(tag)) {
          selectedTags.add(tag);

          const tagElement = document.createElement("div");
          tagElement.className = "tag is-info";
          tagElement.textContent = tag;

          const removeButton = document.createElement("button");
          removeButton.className = "delete is-small";
          removeButton.addEventListener("click", () => {
            selectedTags.delete(tag);
            tagsList.removeChild(tagElement);
            updateHiddenInput();
          });

          tagElement.appendChild(removeButton);
          tagsList.appendChild(tagElement);
          updateHiddenInput();
        }

        tagsInput.value = "";
        updateSuggestions();
      }

      // Met à jour le champ masqué avec les tags sélectionnés
      function updateHiddenInput() {
        tagsHiddenInput.value = Array.from(selectedTags).join(",");
        if (selectedTags.size === 0) {
          tagsList.classList.add("is-hidden");
        }
      }

      // Gestion des événements
      tagsInput.addEventListener("input", updateSuggestions);

      tagsInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          addTag(tagsInput.value);
        }
      });

      suggestionsList.addEventListener("click", event => {
        if (event.target.classList.contains("dropdown-item")) {
          addTag(event.target.textContent);
        }
      });

      document.addEventListener("click", event => {
        if (!suggestionsDropdown.contains(event.target) && event.target !== tagsInput) {
          suggestionsDropdown.classList.remove("is-active");
        }
      });
    });
    </script>


{% endblock %}
