    <style>
        .lens-controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            justify-content: center;
        }
        .lens-controls button {
            background-color: rgb(0, 0, 0, 0.5);
            color: white;
        }
        .lens-controls button:hover,
        .lens-controls button:focus {
            color: gold;
        }
        .camera-controls {
            justify-content: space-between;
        }
        #barcode-result {
            text-align: center;
            font-size: 1.5em;
            margin-top: 10px;
            font-weight: bold;
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>

    <div class="container block">
        <video id="video" autoplay playsinline></video>

        <div class="buttons lens-controls">
            <button class="button is-rounded" onclick="switchCamera('ultra-wide')">.5x</button>
            <button class="button is-rounded" onclick="switchCamera('environment')">1x</button>
            <button class="button is-rounded" onclick="switchCamera('zoom')">2x</button>
        </div>
        <div class="buttons camera-controls">
            <button class="button is-warning is-rounded" onclick="toggleTorch()">
                <span class="icon is-small">
                  <i class="fas fa-bolt"></i>
                </span>
            </button>
            <button id="switch-side" class="button is-rounded" onclick="switchCamera('user')">
                <span class="icon is-small">
                  <i class="fas fa-sync"></i>
                </span>
            </button>
        </div>
    </div>

    <script>
        let videoStream;

        async function switchCamera(cameraType) {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }

            let constraints = {
                video: {
                    facingMode: cameraType === 'user' ? 'user' : 'environment',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            };

            if (cameraType === 'user') {
                document.getElementById('switch-side').onclick = () => switchCamera('environment');
            } else {
                document.getElementById('switch-side').onclick = () => switchCamera('user');
            }

            if (cameraType === 'ultra-wide' || cameraType === 'zoom') {
                constraints.video.advanced = [{ zoom: cameraType === 'zoom' ? 2 : 0.5 }];
            }

            try {
                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                document.getElementById('video').srcObject = videoStream;
                startBarcodeScanner();
            } catch (error) {
                console.error("Erreur d'accès à la caméra :", error);
            }
        }

        async function toggleTorch() {
            if (!videoStream) return;

            let track = videoStream.getVideoTracks()[0];
            let capabilities = track.getCapabilities();

            if (!capabilities.torch) {
                console.warn("La lampe torche n'est pas supportée sur cet appareil.");
                return;
            }

            let torchState = !track.getSettings().torch;
            await track.applyConstraints({ advanced: [{ torch: torchState }] });
        }

        function startBarcodeScanner() {
            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: document.querySelector("#video"),
                    constraints: {
                        facingMode: "environment"
                    }
                },
                locator: {
                    patchSize: "medium",
                    halfSample: true
                },
                numOfWorkers: 8,
                frequency: 10,
                decoder: {
                    readers: ["ean_reader"] // Scanner les codes-barres EAN-13
                },
                locate: true
            }, function (err) {
                if (err) {
                    console.error("Erreur Quagga : ", err);
                    return;
                }
                Quagga.start();
            });

            // Quagga.onProcessed(drawOverlay);
            Quagga.onDetected(onBarcodeDetected);
        }

        function onBarcodeDetected(result) {
            let code = result.codeResult.code;

            if (!isISBN(code)) {
                console.log("Code-barres invalide : ", code);
                return;
            }

            console.log("Code-barres détecté : ", code);

            // does the book exist in the database?
            // if yes, redirect to the book edit page
            // if no, redirect to the book creation page
            fetch(`/livre/${code}/exist`)
                .then(response => response.json())
                .then(data => {
                    // if the book does not exist, redirect to the book creation page
                    if (data.error) {
                        console.info("Erreur de recherche du livre :", data.error);
                        window.location.href = `/livre/ajout?isbn=${code}`;

                        return;
                    }

                    window.location.href = `/livre/${data.id}/edit`;
                })
                .catch(error => console.error("Erreur de recherche du livre :", error));
        }

        function isISBN(code) {
            return code.length === 13 && code.startsWith("978");
        }

        switchCamera('environment'); // Par défaut sur la caméra arrière
    </script>


{% endblock %}
