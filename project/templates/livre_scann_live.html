{% extends "base.html" %} {% block content %}

<h1 class="title is-1">Scanner des livres</h1>

<section id="section">
  <div id="result_strip"></div>
</section>

<div class="section">
  <div class="container is-max-tablet">
    <div id="interactive" class="viewport"></div>
  </div>
</div>

<!-- Affichage message d'erreur si il n'y a pas de cam -->
<div class="section">
  <div id="error"></div>
</div>

<script src="/static/javascript/jquery-1.9.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2/dist/quagga.min.js"></script>
<script
  src="//webrtc.github.io/adapter/adapter-latest.js"
  type="text/javascript"
></script>
<!--
    <script src="{{ url_for('static', filename='/javascript/jquery-1.9.0.min.js') }}" type="text/javascript"> </script>
    <script src="{{ url_for('static', filename='/javascript/quagga.min.js') }}" type="text/javascript"> </script>
    <script src="{{ url_for('static', filename='/javascript/live_w_locator.js') }}" type="text/javascript"> </script>
    -->

<!-- Utilisé pour supprimer les notifications -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    (document.querySelectorAll(".notification .delete") || []).forEach(
      ($delete) => {
        const $notification = $delete.parentNode;

        $delete.addEventListener("click", () => {
          $notification.parentNode.removeChild($notification);
        });
      }
    );
  });
</script>

<script>
  $(function () {
    var resultCollector = Quagga.ResultCollector.create({
      capture: true,
      capacity: 20,
      blacklist: [
        {
          code: "WIWV8ETQZ1",
          format: "code_93",
        },
        {
          code: "EH3C-%GU23RK3",
          format: "code_93",
        },
        {
          code: "O308SIHQOXN5SA/PJ",
          format: "code_93",
        },
        {
          code: "DG7Q$TV8JQ/EN",
          format: "code_93",
        },
        {
          code: "VOFD1DB5A.1F6QU",
          format: "code_93",
        },
        {
          code: "4SO64P4X8 U4YUU1T-",
          format: "code_93",
        },
      ],
      filter: function (codeResult) {
        // only store results which match this constraint
        // e.g.: codeResult
        return true;
      },
    });
    var App = {
      init: function () {
        var self = this;

        Quagga.init(this.state, function (err) {
          if (err) {
            return self.handleError(err);
          }
          //Quagga.registerResultCollector(resultCollector);
          App.attachListeners();
          App.checkCapabilities();
          Quagga.start();
        });
      },
      handleError: function (err) {
        if (err.name === "NotReadableError") {
          // La caméra n'est pas disponible
          // afficher un message d'erreur dans le div avec l'id error

          var $node = null;
          $node = $(
            '<div class="notification is-danger is-light">' +
              '<button class="delete"></button>' +
              "Aucune caméra n'a été détectée." +
              "</div>"
          );

          $("#result_strip").html($node);
        }

        console.log(err);
      },
      checkCapabilities: function () {
        var track = Quagga.CameraAccess.getActiveTrack();
        var capabilities = {};
        if (typeof track.getCapabilities === "function") {
          capabilities = track.getCapabilities();
        }
        this.applySettingsVisibility("zoom", capabilities.zoom);
        this.applySettingsVisibility("torch", capabilities.torch);
      },
      updateOptionsForMediaRange: function (node, range) {
        console.log("updateOptionsForMediaRange", node, range);
        var NUM_STEPS = 6;
        var stepSize = (range.max - range.min) / NUM_STEPS;
        var option;
        var value;
        while (node.firstChild) {
          node.removeChild(node.firstChild);
        }
        for (var i = 0; i <= NUM_STEPS; i++) {
          value = range.min + stepSize * i;
          option = document.createElement("option");
          option.value = value;
          option.innerHTML = value;
          node.appendChild(option);
        }
      },
      applySettingsVisibility: function (setting, capability) {
        // depending on type of capability
        if (typeof capability === "boolean") {
          var node = document.querySelector(
            'input[name="settings_' + setting + '"]'
          );
          if (node) {
            node.parentNode.style.display = capability ? "block" : "none";
          }
          return;
        }
        if (
          window.MediaSettingsRange &&
          capability instanceof window.MediaSettingsRange
        ) {
          var node = document.querySelector(
            'select[name="settings_' + setting + '"]'
          );
          if (node) {
            this.updateOptionsForMediaRange(node, capability);
            node.parentNode.style.display = "block";
          }
          return;
        }
      },
      initCameraSelection: function () {
        var streamLabel = Quagga.CameraAccess.getActiveStreamLabel();

        return Quagga.CameraAccess.enumerateVideoDevices().then(function (
          devices
        ) {
          function pruneText(text) {
            return text.length > 30 ? text.substr(0, 30) : text;
          }
          var $deviceSelection = document.getElementById("deviceSelection");
          while ($deviceSelection.firstChild) {
            $deviceSelection.removeChild($deviceSelection.firstChild);
          }
          devices.forEach(function (device) {
            var $option = document.createElement("option");
            $option.value = device.deviceId || device.id;
            $option.appendChild(
              document.createTextNode(
                pruneText(device.label || device.deviceId || device.id)
              )
            );
            $option.selected = streamLabel === device.label;
            $deviceSelection.appendChild($option);
          });
        });
      },
      attachListeners: function () {
        var self = this;

        self.initCameraSelection();
        $(".controls").on("click", "button.stop", function (e) {
          e.preventDefault();
          Quagga.stop();
          self._printCollectedResults();
        });

        $(".controls .reader-config-group").on(
          "change",
          "input, select",
          function (e) {
            e.preventDefault();
            var $target = $(e.target),
              value =
                $target.attr("type") === "checkbox"
                  ? $target.prop("checked")
                  : $target.val(),
              name = $target.attr("name"),
              state = self._convertNameToState(name);

            console.log("Value of " + state + " changed to " + value);
            self.setState(state, value);
          }
        );
      },
      _printCollectedResults: function () {
        var results = resultCollector.getResults(),
          $ul = $("#result_strip ul.collector");

        results.forEach(function (result) {
          var $li = $(
            '<li><div class="thumbnail"><div class="imgWrapper"><img /></div><div class="caption"><h4 class="code"></h4></div></div></li>'
          );

          $li.find("img").attr("src", result.frame);
          $li
            .find("h4.code")
            .html(
              result.codeResult.code + " (" + result.codeResult.format + ")"
            );

          $ul.prepend($li);
        });
      },
      _accessByPath: function (obj, path, val) {
        var parts = path.split("."),
          depth = parts.length,
          setter = typeof val !== "undefined" ? true : false;

        return parts.reduce(function (o, key, i) {
          if (setter && i + 1 === depth) {
            if (typeof o[key] === "object" && typeof val === "object") {
              Object.assign(o[key], val);
            } else {
              o[key] = val;
            }
          }
          return key in o ? o[key] : {};
        }, obj);
      },
      _convertNameToState: function (name) {
        return name
          .replace("_", ".")
          .split("-")
          .reduce(function (result, value) {
            return result + value.charAt(0).toUpperCase() + value.substring(1);
          });
      },
      detachListeners: function () {
        $(".controls").off("click", "button.stop");
        $(".controls .reader-config-group").off("change", "input, select");
      },
      applySetting: function (setting, value) {
        var track = Quagga.CameraAccess.getActiveTrack();
        if (track && typeof track.getCapabilities === "function") {
          switch (setting) {
            case "zoom":
              return track.applyConstraints({
                advanced: [{ zoom: parseFloat(value) }],
              });
            case "torch":
              return track.applyConstraints({ advanced: [{ torch: !!value }] });
          }
        }
      },
      setState: function (path, value) {
        var self = this;

        if (typeof self._accessByPath(self.inputMapper, path) === "function") {
          value = self._accessByPath(self.inputMapper, path)(value);
        }

        if (path.startsWith("settings.")) {
          var setting = path.substring(9);
          return self.applySetting(setting, value);
        }
        self._accessByPath(self.state, path, value);

        console.log(JSON.stringify(self.state));
        App.detachListeners();
        Quagga.stop();
        App.init();
      },
      inputMapper: {
        inputStream: {
          constraints: function (value) {
            if (/^(\d+)x(\d+)$/.test(value)) {
              var values = value.split("x");
              return {
                width: { min: parseInt(values[0]) },
                height: { min: parseInt(values[1]) },
              };
            }
            return {
              deviceId: value,
            };
          },
        },
        numOfWorkers: function (value) {
          return parseInt(value);
        },
        decoder: {
          readers: function (value) {
            if (value === "ean_extended") {
              return [
                {
                  format: "ean_reader",
                  config: {
                    supplements: ["ean_5_reader", "ean_2_reader"],
                  },
                },
              ];
            }
            return [
              {
                format: value + "_reader",
                config: {},
              },
            ];
          },
          debug: {
            drawBoundingBox: false,
            showFrequency: false,
            drawScanline: false,
            showPattern: false,
          },
          multiple: false,
        },
      },
      state: {
        inputStream: {
          type: "LiveStream",
          constraints: {
            width: { min: 640 },
            height: { min: 480 },
            facingMode: "environment",
            aspectRatio: { min: 1, max: 2 },
          },
        },
        locator: {
          patchSize: "medium",
          halfSample: true,
        },
        numOfWorkers: 4,
        frequency: 10,
        decoder: {
          readers: [
            {
              format: "ean_reader",
              config: {},
            },
          ],
        },
        locate: false,
      },
      lastResult: null,
    };

    App.init();

    Quagga.onProcessed(function (result) {
      const drawingCanvas = Quagga.canvas.dom.overlay;
      drawingCanvas.style.display = "none";
    });

    Quagga.onDetected(function (result) {
      var code = result.codeResult.code;

      if (App.lastResult !== code) {
        App.lastResult = code;

        console.log("Code détecté : " + code);

        let sum = 0;
        let check = 0;

        if (code.length === 10) {
          for (var i = 0; i < code.length; i++) {
            sum += (10 - i) * parseInt(code[i], 10);
          }
          let check = 11 - (sum % 11);
          if (check === 10) {
            check = "X";
          } else if (check === 11) {
            check = "0";
          }
        } else if (code.length === 13) {
          for (var i = 0; i < code.length - 1; i++) {
            sum += ((i % 2) * 2 + 1) * parseInt(code[i], 10);
          }
          check = 10 - (sum % 10);
          if (check === 10) {
            check = "0";
          }
        }

        //console.log(sum + " " + check);

        if (
          check === code[code.length - 1] ||
          check === parseInt(code[code.length - 1])
        ) {
          //console.log("Code valide : " + code);

          fetch(
            `https://www.googleapis.com/books/v1/volumes?q=isbn:${code}&printType=books&orderBy=relevance&maxResults=1&key=AIzaSyDu1_-0yGIVA_CoTyaDbX1ltVgPPDqNsZk`
          )
            .then((response) => response.json())
            .then((data) => {
              console.log(data);
              if (data.totalItems > 0) {
                let book = data.items[0].volumeInfo;
                let title = book.title;
                let authors = book.authors.join(", ");
                let editor = book.publisher;
                let year = book.publishedDate;
                let type = book.subtitle;

                // Afficher les résultats
                var $node = null,
                  canvas = Quagga.canvas.dom.image;
                $node = $(
                  '<div class="result"> ' +
                    '<form method="POST" action="/livre/ajout">' +
                    '<label class="label">Titre </label>' +
                    '<div class="control">' +
                    '<input class="input" type="text" name="title" value="' +
                    title +
                    '">' +
                    "</div>" +
                    '<label class="label">Auteurs </label>' +
                    '<div class="control">' +
                    '<input class="input" type="text" name="authors" value="' +
                    authors +
                    '">' +
                    "</div>" +
                    '<label class="label">Editeur </label>' +
                    '<div class="control">' +
                    '<input class="input" type="text" name="editor" value="' +
                    editor +
                    '">' +
                    "</div>" +
                    '<label class="label">Année </label>' +
                    '<div class="control">' +
                    '<input class="input" type="text" name="year" value="' +
                    year +
                    '">' +
                    "</div>" +
                    '<label class="label">Type </label>' +
                    '<div class="control">' +
                    '<input class="input" type="text" name="type" value="' +
                    type +
                    '">' +
                    "</div>" +
                    '<label class="label">ISBN </label>' +
                    '<div class="control">' +
                    '<input class="input" type="number" name="isbn" value="' +
                    code +
                    '">' +
                    "</div>" +
                    '<label class="label"> </label>' +
                    '<div class="control">' +
                    '<button class="button is-link" id="enregistrer-btn">Enregistrer</button>' +
                    "</div>" +
                    "</form>" +
                    "</div>"
                );

                // ask /livre/<isbn>/exist to check if the book already exists in the database
                fetch(`/livre/${code}/exist`).then((response) => {
                  console.log(response);
                  if (response.ok) {
                    response
                      .json() // Convertir la réponse en JSON

                      .then(function (response) {
                        console.log("id : ", response.id);
                        book_id = response.id;

                        $node = $(
                          `<div>
                                                    <h4 class="title is-4">Ce livre est déjà dans la bibliothèque</h4>
                                                    <a href='/livre/${book_id}/edit' class="button is-medium is-primary is-light">Voir le livre</a>
                                                </div>`
                        );

                        $("#result_strip").html($node);
                      });
                  }
                });

                $("#result_strip").html($node);
              } else {
                // pas de livre trouvé dans google books
                var $node = null;
                $node = $(
                  '<h4 class="subtitle is-4">' +
                    "Aucun livre trouvé pour cet ISBN" +
                    "</h4>" +
                    '<p class="has-text-danger is-size-4">' +
                    code +
                    "</p>"
                );

                $("#result_strip").html($node);
              }
            });
        }
      }
    });
  });
</script>

{% endblock %}
