<!-- templates/login.html -->

{% extends "base.html" %}

{% block content %}
<div class="column is-6 is-offset-2">
    <h3 class="title">Ajouter un élève</h3>
    <div class="box">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="notification is-danger">
                {{ messages[0] }}
            </div>
        {% endif %}
        {% endwith %}
        <form method="POST" action="/eleve/ajout">
            <div class="field">
                <div class="control">
                    <input class="input is-large" type="text" name="name" placeholder="Nom" autofocus="">
                </div>
            </div>

            <div class="field">
                <div class="control">
                    <input class="input is-large" type="text" name="firstname" placeholder="Prénom">
                </div>
            </div>

            <div class="field is-grouped">
                <div class="control">
                    <button class="button is-block is-info is-large is-fullwidth">Ajouter</button>
                </div>
                <div class="control">
                    <button class="button is-block is-light is-large is-fullwidth">
                        <a href="/eleve" class="has-text-black">Annuler</a>
                    </button>
                </div>
            </div>

        </form>
    </div>
</div>
{% endblock %}
