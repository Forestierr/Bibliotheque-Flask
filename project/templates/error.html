<!-- templates/error.html -->

{% from "utils/navbar.html" import navbar %}

{% extends "base.html" %}

{% block navbar %}
    {{ navbar(current_user, "Ma Bibliothèque") }}
{% endblock %}

{% block content %}

    <section class="section">
        <div class="columns is-multiline is-centered is-vcentered m-2">
            <div class="column is-4-mobile is-offset-8-mobile is-3-tablet is-3-desktop is-2-widescreen is-2-fullhd">
                <figure class="image is-256x256">
                    <img src="{{ url_for('static',filename='image/server.png') }}"
                         alt="{{ _('Illustration serveur') }}">
                </figure>
            </div>

            <div class="column">
              <div class="myHero has-text-centered">
                <div class="hr"></div>
                <h1 class="title is-1 is-spaced">{{ _("Oups petite erreur ...") }}</h1>
                <h2 class="subtitle is-4 is-spaced">{{ error.name }} {{ error.code }}</h2>
                <p class="is-spaced">{{ error.description }}</p>
              </div>
            </div>

            <div class="column is-4-mobile is-3-tablet is-3-desktop is-2-widescreen is-2-fullhd">
                <figure class="image is-256x256 is-pulled-right">
                    <img src="{{ url_for('static',filename='image/warning.png') }}"
                         alt="{{ _('Illustration avertissement') }}">
                </figure>
            </div>

        </div>
    </section>

{% endblock %}
