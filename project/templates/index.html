<!-- templates/index.html -->

{% extends "base.html" %}

{% block content %}

    <section class="section">
        <div class="columns is-multiline is-centered is-vcentered m-2">
            <div class="column is-4-mobile is-offset-8-mobile is-3-tablet is-3-desktop is-2-widescreen is-2-fullhd">
                <a href="{{ url_for('livre.livre_db') }}">
                    <figure class="image is-256x256">
                        <img src="{{ url_for('static',filename='/image/book.png') }}"
                             href="https://www.flaticon.com/free-stickers/literature"
                             alt="Literature stickers created by Stickers - Flaticon">
                    </figure>
                </a>
            </div>

            <div class="column">
              <div class="myHero has-text-centered">
                <div class="hr"></div>
                <h1 class="title is-1 is-spaced">LivreEnClasse</h1>
                <h2 class="subtitle is-4 block">Ma bibliothèque personnelle.</h2>
                <div class="container block">
                    <p>Gérez vos livres, vos emprunts et vos élèves.</p>
                    <p>Ajoutez, modifiez et supprimez des livres.</p>
                    <p>Tout est possible avec Ma Bibliothèque.</p>
                </div>

                <div class="block is-max-tablet">
                    <a class="button is-grey is-rounded is-medium block" href="{{ url_for('auth.signup') }}">Créer un compte</a>
                    <a class="button is-info is-rounded is-medium block" href="{{ url_for('auth.login') }}">Se connecter</a>
                </div>
              </div>
            </div>

            <div class="column is-4-mobile is-3-tablet is-3-desktop is-2-widescreen is-2-fullhd">
                <a href="{{ url_for('eleve.eleve_db') }}">
                    <figure class="image is-256x256 is-pulled-right">
                        <img src="{{ url_for('static',filename='/image/boy.png') }}"
                        href="https://www.flaticon.com/free-stickers/reading"
                         alt="Reading stickers created by Stickers - Flaticon">
                    </figure>
                </a>
            </div>
        </div>
    </section>

{% endblock %}
