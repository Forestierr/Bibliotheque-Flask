<!-- templates/profile.html -->

{% extends "base.html" %}

{% block content %}
    <h1 class="title is-1">
      Modifier le livre {{ book.title }}
    </h1>

    <div class="content">
        <form action="/livre/{{ book.id }}/edit" method="post">
            <div class="field">
                <label class="label" for="title">Titre</label>
                <div class="control">
                    <input class="input" type="text" name="title" id="title" value="{{ book.title }}" required>
                </div>
            </div>

            <div class="field">
                <label class="label" for="author">Auteur</label>
                <div class="control">
                    <input class="input" type="text" name="author" id="author" value="{{ book.author }}">
                </div>
            </div>

            <div class="field">
                <label class="label" for="editor">Editeur</label>
                <div class="control">
                    <input class="input" type="text" name="editor" id="editor" value="{{ book.editor }}">
                </div>
            </div>

            <div class="field">
                <label class="label" for="year">Année</label>
                <div class="control">
                    <input class="input" type="number" name="year" id="year" value="{{ book.year }}">
                </div>
            </div>

            <div class="field">
                <label class="label" for="type">Genre</label>
                <div class="control">
                    <input class="input" type="text" name="type" id="type" value="{{ book.type }}">
                </div>
            </div>

            <div class="field">
                <label class="label" for="isbn">ISBN</label>
                <div class="control">
                    <input class="input" type="number" name="isbn" id="isbn" value="{{ book.isbn }}">
                </div>
            </div>

            <div class="field">
                <label class="label" for="tags">Étiquettes</label>
                <div class="control">
                    <div class="tags-input-container">
                        <div id="tags-list" class="tags {% if not book_tags %}is-hidden{% endif %}"></div>
                        <input
                                id="tags-input"
                                class="input"
                                type="text"
                                placeholder="Ajouter une étiquette ou une catégorie"
                                autocomplete="off"
                        />
                    </div>
                </div>
                <input type="hidden" name="tags" id="tags-hidden-input" value="{{ book_tags[0] }}" />
                <div class="dropdown" id="suggestions-dropdown">
                    <div class="dropdown-menu">
                        <div class="dropdown-content" id="suggestions-list"></div>
                    </div>
                </div>
            </div>

            <div class="field">
                <label class="label" for="students">Élève possédant le livre</label>
                <div class="select">
                    <select name="student" id="student-select">
                        {% if student %}
                            <option value="{{ student.id }}" selected>{{ student.name }} {{ student.firstname }}</option>
                        {% endif %}
                        <option value="">--Le livre se trouve dans le bibliothèque--</option>
                    {% for student in students %}
                        <option value="{{ student[0] }}">{{ student[1] }} {{ student[2] }}</option>
                    {% endfor %}
                    </select>
                </div>
            </div>

            <div class="field is-grouped">
              <div class="control">
                <button class="button is-link">Enregistrer</button>
              </div>
              <div class="control">
                <button class="button is-light">
                    <a href="/livre" class="">Annuler</a>
                </button>
              </div>
            </div>
        </form>
    </div>

    <div class="container">
        <div id="delete-modal" class="modal">
          <div class="modal-background"></div>
          <div class="modal-content">
            <div class="modal-card">
                <header class="modal-card-head">
                    <p class="modal-card-title">Supprimer le livre</p>
                </header>
                <footer class="modal-card-foot">
                    <a href="/livre/{{ book.id }}/delete" class="button is-normal is-danger is-responsive">
                        <div class="icon-text">
                            <span class="icon has-text-info">
                                <i class="fa-solid fa-trash has-text-black"></i>
                            </span>
                            <span class="has-text-black has-text-weight-semibold">Supprimer le livre</span>
                        </div>
                    </a>
                    <a href="/livre/{{ book.id }}/edit" class="button is-normal is-responsive">Annuler</a>
                </footer>
            </div>
          </div>
          <button class="modal-close is-large" id="modal-close" aria-label="close"></button>
        </div>
        <br>
        <button class="button is-normal is-danger is-responsive" id="showModal">
            <div class="icon-text">
                <span class="icon has-text-info">
                    <i class="fa-solid fa-trash has-text-black"></i>
                </span>
                <span class="has-text-black has-text-weight-semibold">Supprimer le livre</span>
            </div>
        </button>
    </div>

    <!-- Script pour les tags -->
    <script>
    document.addEventListener("DOMContentLoaded", () => {
      const existingTags = {{ tags|safe }}; // Liste des tags existants
      const selectedTags = new Set(); // Ensemble pour les tags sélectionnés
      const tagsInput = document.getElementById("tags-input");
      const tagsList = document.getElementById("tags-list");
      const tagsHiddenInput = document.getElementById("tags-hidden-input");
      const suggestionsDropdown = document.getElementById("suggestions-dropdown");
      const suggestionsList = document.getElementById("suggestions-list");

      window.onload = function () {
        for (let tag of {{ book_tags|safe }}) {
            if (tag) {
                addTag(tag);
            }
        }
      }

      // Mise à jour des suggestions
      function updateSuggestions() {
        const input = tagsInput.value.toLowerCase();
        const suggestions = existingTags.filter(tag =>
          tag.toLowerCase().includes(input) && !selectedTags.has(tag)
        );

        suggestionsList.innerHTML = suggestions
          .map(tag => `<a class="dropdown-item">${tag}</a>`)
          .join("");

        if (suggestions.length > 0) {
          suggestionsDropdown.classList.add("is-active");
        } else {
          suggestionsDropdown.classList.remove("is-active");
        }
      }

      // Ajouter un tag
      function addTag(tag) {
        if (tagsList.classList.contains("is-hidden")) {
          tagsList.classList.remove("is-hidden");
        }

        if (tag && !selectedTags.has(tag)) {
          selectedTags.add(tag);

          const tagElement = document.createElement("div");
          tagElement.className = "tag is-info";
          tagElement.textContent = tag;

          const removeButton = document.createElement("button");
          removeButton.className = "delete is-small";
          removeButton.addEventListener("click", () => {
            selectedTags.delete(tag);
            tagsList.removeChild(tagElement);
            updateHiddenInput();
          });

          tagElement.appendChild(removeButton);
          tagsList.appendChild(tagElement);
          updateHiddenInput();
        }

        tagsInput.value = "";
        updateSuggestions();
      }

      // Met à jour le champ masqué avec les tags sélectionnés
      function updateHiddenInput() {
        tagsHiddenInput.value = Array.from(selectedTags).join(",");
        if (selectedTags.size === 0) {
          tagsList.classList.add("is-hidden");
        }
      }

      // Gestion des événements
      tagsInput.addEventListener("input", updateSuggestions);

      tagsInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          addTag(tagsInput.value);
        }
      });

      suggestionsList.addEventListener("click", event => {
        if (event.target.classList.contains("dropdown-item")) {
          addTag(event.target.textContent);
        }
      });

      document.addEventListener("click", event => {
        if (!suggestionsDropdown.contains(event.target) && event.target !== tagsInput) {
          suggestionsDropdown.classList.remove("is-active");
        }
      });
    });
    </script>

    <!-- Script pour les modals -->
    <script>
        var btn = document.querySelector('#showModal');
        var modalDlg = document.querySelector('#delete-modal');
        var modalCloseBtn = document.querySelector('#modal-close');
        btn.addEventListener('click', function(){
          modalDlg.classList.add('is-active');
        });

        modalCloseBtn.addEventListener('click', function(){
          modalDlg.classList.remove('is-active');
        });
    </script>


{% endblock %}
