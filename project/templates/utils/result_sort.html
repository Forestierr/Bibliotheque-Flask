<div class="columns is-mobile block">
    <div class="column">
        <div class="select is-rounded is-small">
          <select id="select-sort" name="sort"
            hx-post="/livre/search"
            hx-trigger="change"
            hx-target="#book_list"
            hx-include="[name='search'], [name='n_results']">
            <option value="pertinent">Pertinent</option>
            <option value="az">A -> Z</option>
            <option value="za">Z -> A</option>
            <option value="p_emprunte">Plus emprunté</option>
            <option value="m_emprunte">Moins emprunté</option>
          </select>
        </div>
    </div>
    <div class="column has-text-right">
        <div class="select is-rounded is-small">
          <select id="select-resutls" name="n_results"
            hx-post="/livre/search"
            hx-trigger="change"
            hx-target="#book_list"
            hx-include="[name='search'], [name='sort']">
            <option value="10">10 résultats</option>
            <option value="20">20 résultats</option>
            <option value="50">50 résultats</option>
            <option value="100">100 résultats</option>
          </select>
        </div>
    </div>
</div>
