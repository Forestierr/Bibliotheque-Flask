<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.6; color: #0f172a;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f8fafc; padding: 36px 12px;">
        <tr>
            <td align="center">
                <!-- Main Container -->
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; background-color: #ffffff; border: 1px solid #cbd5e1; border-top: 3px solid #0f172a; border-radius: 4px; overflow: hidden;">
                    
                    <!-- Official Header -->
                    <tr>
                        <td style="padding: 28px 36px 20px 36px; border-bottom: 1px solid #e2e8f0;">
                            <table role="presentation" border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="left" style="vertical-align: top;">
                                        <p style="margin: 0; font-size: 13px; font-weight: 800; color: #0f172a; letter-spacing: 1px; text-transform: uppercase;">
                                            Livres en Classe
                                        </p>
                                        <p style="margin: 2px 0 0 0; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;">
                                            Service de gestion &bull; Communication officielle
                                        </p>
                                    </td>
                                    <td align="right" style="vertical-align: top;">
                                        <span style="display: inline-block; padding: 3px 8px; font-size: 11px; font-weight: 700; color: #0f172a; background-color: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 3px; letter-spacing: 0.5px; text-transform: uppercase;">
                                            Circulaire
                                        </span>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Subject / Title -->
                    <tr>
                        <td style="padding: 28px 36px 12px 36px;">
                            <h1 style="margin: 0; font-size: 21px; font-weight: 700; color: #0f172a; line-height: 1.35;">
                                {{ subject }}
                            </h1>
                        </td>
                    </tr>

                    <!-- Body Content -->
                    <tr>
                        <td style="padding: 12px 36px 36px 36px; font-size: 15px; color: #334155; line-height: 1.7;">
                            {{ content|safe }}
                        </td>
                    </tr>

                    <!-- Footer Divider -->
                    <tr>
                        <td style="padding: 0 36px;">
                            <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 0;">
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 24px 36px; background-color: #f8fafc; font-size: 12px; color: #64748b; line-height: 1.6;">
                            <p style="margin: 0 0 6px 0;">
                                Communication administrative émise par l'équipe de <a href="https://livresenclasse.com" style="color: #0f172a; font-weight: 600; text-decoration: none;">LivresEnClasse.com</a>.
                            </p>
                            <p style="margin: 0;">
                                <a href="{{ url_for('auth.reglage', _external=True) }}" style="color: #475569; text-decoration: underline;">Préférences</a>
                                &nbsp;&bull;&nbsp;
                                <a href="{{ unsubscribe_url }}" style="color: #475569; text-decoration: underline;">Se désabonner</a>
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
