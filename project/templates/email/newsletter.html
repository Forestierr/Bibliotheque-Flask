<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ subject }}</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #f8f9fa; padding: 20px; text-align: center; border-radius: 8px 8px 0 0;">
        <h2 style="color: #4a4a4a; margin: 0;">LivresEnClasse</h2>
    </div>
    
    <div style="padding: 30px 20px; border: 1px solid #eeeeee; border-top: none; border-radius: 0 0 8px 8px;">
        {{ content|safe }}
    </div>
    
    <div style="margin-top: 30px; text-align: center; font-size: 12px; color: #999999;">
        <p>Cet email a été envoyé par l'équipe de <a href="https://livresenclasse.com" style="color: #666666; text-decoration: underline;">LivresEnClasse.com</a>.</p>
    </div>
</body>
</html>
