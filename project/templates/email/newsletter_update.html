<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>{{ subject }}</title>
</head>
<body style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #2c3e50; max-width: 600px; margin: 0 auto; padding: 20px; background-color: #f9f9fa;">
    
    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 30px; text-align: center; border-radius: 12px 12px 0 0;">
        <h1 style="color: #ffffff; margin: 0; font-size: 28px; letter-spacing: 1px;">LivresEnClasse</h1>
        <p style="color: #e0e7ff; margin: 5px 0 0 0; font-size: 14px;">Mise à jour & Nouveautés</p>
    </div>
    
    <div style="background-color: #ffffff; padding: 40px 30px; border: 1px solid #e2e8f0; border-top: none; border-radius: 0 0 12px 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02);">
        
        <div style="background-color: #f8fafc; border-left: 4px solid #667eea; padding: 15px 20px; margin-bottom: 25px; border-radius: 0 4px 4px 0;">
            <h3 style="margin: 0 0 10px 0; color: #4a5568;">Au programme :</h3>
            <p style="margin: 0; color: #718096; font-size: 15px;">Découvrez les dernières améliorations apportées à votre bibliothèque de classe.</p>
        </div>

        <div style="font-size: 16px; color: #4a5568;">
            {{ content|safe }}
        </div>
        
        <div style="text-align: center; margin-top: 35px;">
            <a href="https://livresenclasse.com" style="display: inline-block; background-color: #667eea; color: #ffffff; text-decoration: none; padding: 12px 25px; border-radius: 6px; font-weight: bold;">Accéder à mon espace</a>
        </div>
    </div>
    
    <div style="margin-top: 25px; text-align: center; font-size: 13px; color: #a0aec0;">
        <p>Vous recevez cet email car vous êtes inscrit sur <a href="https://livresenclasse.com" style="color: #718096; text-decoration: underline;">LivresEnClasse.com</a>.</p>
    </div>
</body>
</html>
