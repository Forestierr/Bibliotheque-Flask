name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint-format-test:
    name: Lint, Format, and Test
    # Ne pas lancer le job si c'est une pull request en draft
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f project/requirements.txt ]; then pip install -r project/requirements.txt; fi

      - name: Check formatting with Ruff
        run: ruff format --check project/
        
      - name: Lint with Ruff
        run: ruff check project/

      - name: Verify compiled translations (.mo) are up to date
        run: |
          pybabel compile -d project/translations
          if [ -n "$(git status --porcelain -uall project/translations/)" ]; then
            echo "::error::Les fichiers de traduction compilés (.mo) sont manquants ou ne sont pas à jour avec les fichiers .po."
            echo "Veuillez exécuter 'pybabel compile -d project/translations' et commiter les fichiers .mo générés."
            git status --porcelain -uall project/translations/
            exit 1
          fi

      - name: Run tests with pytest
        run: pytest project/test/
        env:
          FLASK_APP: project
          SQLALCHEMY_DATABASE_URI: "sqlite:///:memory:"
          SECRET_KEY: "dummy-secret-key-for-tests"
