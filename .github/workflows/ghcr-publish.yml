name: Publish to GHCR

on:
  push:
    branches:
      - main
      - master
      - fix

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # 2. Tag 'latest' uniquement sur la branche par défaut
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag dynamique avec le nom de la branche (donnera ghcr.io/...:fix)
            type=ref,event=branch
            # (Optionnel) Tag explicite 'staging' quand on pousse sur la branche fix
            type=raw,value=staging,enable=${{ github.ref_name == 'fix' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: project/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
